<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Squat AI 자세 분석</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Use TF.js version recommended by many Teachable Machine Pose examples for v0.8.x -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>

  <!-- Teachable Machine Pose library -->
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8.6/dist/teachablemachine-pose.min.js"></script>
</head>
<body>
  <header>
    <h1>Squat AI — 스쿼트 자세 분석</h1>
    <p>사진을 업로드하거나 웹캠으로 촬영하여 스쿼트 자세가 올바른지 분석합니다.</p>
  </header>

  <main class="container">
    <section class="card">
      <h2>1. 사진 업로드로 분석</h2>
      <div class="controls">
        <input id="fileInput" type="file" accept="image/*" />
        <button id="analyzeFileBtn" disabled>분석</button>
      </div>
      <div class="preview-area">
        <img id="filePreview" alt="업로드된 사진 미리보기" />
      </div>
      <div id="resultFile" class="result"></div>
    </section>

    <section class="card">
      <h2>2. 웹캠 촬영 후 분석</h2>
      <div class="controls">
        <button id="startCamBtn">카메라 시작</button>
        <button id="stopCamBtn" disabled>카메라 종료</button>
        <button id="captureBtn" disabled>촬영</button>
        <button id="retakeBtn" disabled>다시 촬영하기</button>
        <button id="analyzeCaptureBtn" disabled>분석</button>
      </div>

      <div class="cam-area">
        <!-- autoplay 정책 때문에 muted 추가 -->
        <video id="video" autoplay playsinline muted></video>
        <canvas id="captureCanvas" style="display:none"></canvas>
        <div class="preview-area">
          <img id="capturePreview" alt="캡처된 사진 미리보기" />
        </div>
      </div>

      <div id="resultCapture" class="result"></div>
    </section>

    <section class="card">
      <h2>상태</h2>
      <div id="status">모델을 로드하는 중입니다...</div>
    </section>
  </main>

  <footer>
    <small>사진은 브라우저에서만 처리됩니다. 서버에 업로드하지 않습니다.</small>
  </footer>

  <script src="script.js"></script>
</body>
</html>
